name: CI – Unit & Integration Tests

# Run on every push to dev/main and on every pull request targeting those branches.
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  unit-tests:
    name: Unit Tests (shared + androidApp)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Run shared-module KMP unit tests (commonTest / androidUnitTest via Robolectric)
      - name: Run shared module unit tests
        run: ./gradlew :shared:testDebugUnitTest --no-daemon

      # Run androidApp module unit tests (Robolectric – google flavor, debug variant)
      - name: Run androidApp unit tests
        run: ./gradlew :androidApp:testGoogleDebugUnitTest --no-daemon

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            shared/build/reports/tests/
            androidApp/build/reports/tests/
          retention-days: 7

  integration-tests:
    name: Integration Tests (instrumented – emulator)
    runs-on: ubuntu-latest
    # Only run integration tests on PRs and pushes to main to save CI minutes.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Enable KVM (faster emulator on Linux)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented integration tests (google flavor, API 33 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew :androidApp:connectedGoogleDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=com.apps.adrcotfas.goodtime.backup.MidnightBackupIntegrationTest

      - name: Upload instrumented-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: androidApp/build/reports/androidTests/
          retention-days: 7
