name: Build and Release APK

# Triggers when you push a tag like: git tag v3.1.0 && git push origin v3.1.0
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push version bump commit and create release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Extract version name from the git tag (e.g. v3.1.0 → 3.1.0)
      - name: Extract version name from tag
        id: tag_version
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Read current versionCode, increment by 1, write both back to version.properties
      - name: Bump versionCode and update versionName
        id: bump
        run: |
          CURRENT_CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2)
          NEW_CODE=$((CURRENT_CODE + 1))
          NEW_NAME="${{ steps.tag_version.outputs.VERSION_NAME }}"
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=${NEW_CODE}/" version.properties
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${NEW_NAME}/" version.properties
          echo "VERSION_CODE=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "Bumped to versionCode=${NEW_CODE}, versionName=${NEW_NAME}"

      # Commit the updated version.properties back to the repo
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore: bump versionCode to ${{ steps.bump.outputs.VERSION_CODE }} for ${{ steps.bump.outputs.VERSION_NAME }}" || echo "Nothing to commit"
          git push origin HEAD:${{ github.event.repository.default_branch }} || echo "Push skipped (detached HEAD or protected branch)"

      # Build the google-flavor release APK
      - name: Build Release APK (google flavor)
        run: ./gradlew :androidApp:assembleGoogleRelease --no-daemon

      # Locate the built APK and rename it with version info
      - name: Locate and rename APK
        id: apk
        run: |
          APK_SRC=$(find androidApp/build/outputs/apk/google/release -name "*.apk" | head -1)
          APK_DEST="androidApp/build/outputs/apk/PomodoroAuto-${{ steps.bump.outputs.VERSION_NAME }}-build${{ steps.bump.outputs.VERSION_CODE }}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "APK_PATH=${APK_DEST}" >> "$GITHUB_OUTPUT"

      # Create a GitHub Release and attach the APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.bump.outputs.VERSION_NAME }} (build ${{ steps.bump.outputs.VERSION_CODE }})"
          body: |
            ## Pomodoro Auto – v${{ steps.bump.outputs.VERSION_NAME }}

            **Build:** ${{ steps.bump.outputs.VERSION_CODE }}

            ### Install
            Download `PomodoroAuto-*.apk` below and install it on your device.
            > Enable **Install from unknown sources** in Android settings if prompted.

            ---
            *Built automatically by GitHub Actions.*
          files: ${{ steps.apk.outputs.APK_PATH }}
          draft: false
          prerelease: false
