name: Desktop — Release Windows Build

# Triggers when you push a tag like: git tag desktop-v3.1.5 && git push origin desktop-v3.1.5
# Or manually via GitHub Actions → Run workflow
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. desktop-v3.1.5) — leave blank to use latest desktop-v* tag'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build & Release Windows Desktop
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#desktop-v}"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building desktop version: ${VERSION} (tag: ${TAG})"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.1

      - name: Add MinGW to PATH (CGO for WebView2)
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build Windows executable
        working-directory: desktop
        run: wails build -platform windows/amd64 -o "ZenMode-${{ steps.version.outputs.VERSION }}.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Desktop v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Zen Mode Desktop — v${{ steps.version.outputs.VERSION }}

            Windows desktop build (Wails + WebView2).

            ### Install
            1. Download `ZenMode-${{ steps.version.outputs.VERSION }}.exe` below.
            2. Run the executable — no installer needed.
            > Windows may show a SmartScreen warning; click **More info → Run anyway**.

            ---
            *Built automatically by GitHub Actions.*
          files: desktop/build/bin/ZenMode-${{ steps.version.outputs.VERSION }}.exe
          draft: false
          prerelease: false
