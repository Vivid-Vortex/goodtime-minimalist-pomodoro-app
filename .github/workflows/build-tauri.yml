name: Build Tauri Desktop App

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react_desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm deps
        working-directory: react_desktop
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: react_desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Zen Mode ${{ github.ref_name }}'
          releaseBody: |
            ## Zen Mode Desktop App

            Native desktop app built with Tauri — uses OS WebView, ~20–50 MB RAM.

            ### Install
            - **Windows**: download and run the `.exe` installer
            - **macOS**: download the `.dmg`, open and drag to Applications
            - **Linux**: download the `.AppImage`, chmod +x and run

            No Node.js or browser required.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
