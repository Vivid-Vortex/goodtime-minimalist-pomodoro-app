name: Build Tauri Desktop App

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: '*.exe'
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: '*.dmg'
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: '*.AppImage'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react_desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm deps
        working-directory: react_desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: react_desktop
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: goodtime-pomodoro-${{ matrix.os }}
          path: react_desktop/src-tauri/target/release/bundle/${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: react_desktop/src-tauri/target/release/bundle/**/${{ matrix.artifact }}
