name: Bump Version Tag

# Manually trigger from GitHub Actions → Run workflow.
# Reads the latest tag of the chosen type, increments the patch number,
# creates and pushes the new tag — which then triggers the corresponding build workflow.
on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Which version to bump'
        required: true
        type: choice
        options:
          - android
          - desktop
          - both
      bump:
        description: 'Which part to increment'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  bump:
    name: Create incremental version tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Android tag
        if: ${{ inputs.type == 'android' || inputs.type == 'both' }}
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then LATEST="v0.0.0"; fi
          echo "Latest Android tag: $LATEST"

          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          BUMP="${{ inputs.bump }}"
          if [ "$BUMP" = "major" ]; then
            NEW_TAG="v$((MAJOR + 1)).0.0"
          elif [ "$BUMP" = "minor" ]; then
            NEW_TAG="v${MAJOR}.$((MINOR + 1)).0"
          else
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "Creating Android tag: $NEW_TAG"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "✅ Pushed $NEW_TAG — Android build will start automatically."

      - name: Bump Desktop tag
        if: ${{ inputs.type == 'desktop' || inputs.type == 'both' }}
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then LATEST="desktop-v0.0.0"; fi
          echo "Latest Desktop tag: $LATEST"

          VERSION="${LATEST#desktop-v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          BUMP="${{ inputs.bump }}"
          if [ "$BUMP" = "major" ]; then
            NEW_TAG="desktop-v$((MAJOR + 1)).0.0"
          elif [ "$BUMP" = "minor" ]; then
            NEW_TAG="desktop-v${MAJOR}.$((MINOR + 1)).0"
          else
            NEW_TAG="desktop-v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "Creating Desktop tag: $NEW_TAG"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "✅ Pushed $NEW_TAG — Desktop build will start automatically."
