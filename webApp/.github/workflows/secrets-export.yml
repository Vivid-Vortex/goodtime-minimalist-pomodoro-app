name: Export Secrets to Local Environment

on:
  workflow_dispatch:

jobs:
  export-secrets:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Create secrets.env file
      run: |
        echo "# Generated secrets file - $(date)" > secrets.env
        echo "VITE_MONGODB_URI=mongodb+srv://dpkcmn_db_user:${{ secrets.MONGO_PASSWORD }}@pomodoro-web.sidvw0l.mongodb.net/?retryWrites=true&w=majority&appName=pomodoro-web" >> secrets.env
        echo "VITE_MONGODB_DB_NAME=pomodoro-web" >> secrets.env
        
        # Verify the file was created
        echo "Generated secrets.env:"
        cat secrets.env
    
    - name: Upload secrets as artifact
      uses: actions/upload-artifact@v4
      with:
        name: secrets-env
        path: secrets.env
        retention-days: 1