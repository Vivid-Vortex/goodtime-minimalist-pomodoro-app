[package]
name = "goodtime-pomodoro"
version = "1.0.0"
description = "GoodTime Pomodoro — minimalist productivity timer"
authors = ["Vivid-Vortex"]
edition = "2021"

[lib]
name = "goodtime_pomodoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "goodtime-pomodoro"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
